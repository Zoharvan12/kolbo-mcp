name: Publish to npm
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # SHA-pinned, see the note in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # setup-node v5+ caches dependencies automatically once package.json
          # carries a `packageManager` field. It does not today, so this changes
          # nothing now — it is here so that adding that field later cannot
          # silently put a restored cache in the path of a signed release.
          package-manager-cache: false
      - run: npm ci
      - run: npm run smoke
        env:
          KOLBO_API_KEY: dummy_ci_smoke_test
      # --provenance signs the tarball with GitHub's OIDC token so npm shows a
      # "Provenance ✓" badge linking back to this commit + workflow run.
      # Antivirus heuristics (Bitdefender, Norton, etc.) treat provenance-attested
      # packages as much higher trust, which is critical for an MCP server that
      # gets spawned as a long-lived child process by user AI agents.
      # The `id-token: write` permission above is the prerequisite.
      - name: Publish stable or isolated prerelease
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          publish_tag=latest
          if [[ "$version" == *-* ]]; then
            publish_tag=next
          fi
          npm publish --access public --provenance --tag "$publish_tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

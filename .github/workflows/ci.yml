name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a moving tag. A tag can be
      # repointed by whoever controls the action repo; this repo has already
      # taken three supply-chain hits (2026-06-03, 06-17, 08-07), so the
      # release path must not depend on a mutable reference. Bump the SHA and
      # the trailing version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run smoke
        env:
          KOLBO_API_KEY: dummy_ci_smoke_test
      - run: npm run check-skill-bundle
      - run: npm run check-install

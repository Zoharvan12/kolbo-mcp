name: Deprecate an npm version
# Manual only. Sets (or rewrites) the npm deprecation message on ONE published
# version of @kolbo/mcp, using the same NPM_TOKEN the publish workflow uses.
# Used 2026-10-25 to rewrite the 1.57.1 warning, whose old text ("upgrade to
# 1.57.0 or later") read as if 1.57.1 itself were fine.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version, e.g. 1.57.1'
        required: true
      message:
        description: 'Deprecation message shown on install'
        required: true
permissions:
  contents: read
jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Deprecate
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          MESSAGE: ${{ inputs.message }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          npm deprecate "@kolbo/mcp@$VERSION" "$MESSAGE"
          echo "Now: $(npm view "@kolbo/mcp@$VERSION" deprecated)"
